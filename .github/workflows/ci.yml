# What has to hold before anything is merged.
#
# The tests are the interesting part: `tests/determinism.py` plays the
# same game in two fresh interpreters and compares the result, and
# `tests/game.py` plays a whole game of every shipped source and checks
# that nobody broke a rule. Neither needs a display, so the GUI's
# system dependency (freeglut) is not installed here; nothing under
# test imports OpenGL. `tests/startup.py` is the exception that proves
# it: it checks what a machine in exactly this state - no display, no
# freeglut - is told when it asks for a window.
name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python the project claims to support, and the newest
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install the project
        run: uv sync --python ${{ matrix.python }}

      # The same seed has to play the same game, and a game is played
      # by numpy: a clone whose dependency versions were resolved
      # freshly is a clone that can disagree with this one. The lock is
      # committed, and this is what keeps it honest.
      - name: Lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check

      - name: Formatting
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run python -m unittest discover -s tests -t . -p '*.py' --verbose
